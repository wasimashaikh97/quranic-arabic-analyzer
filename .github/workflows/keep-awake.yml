# Keeps the free deployment from idling.
#
# A free Hugging Face Space sleeps after 48 hours without a request; the first
# visitor after that waits while it wakes. Opening the page every six hours
# means it never reaches idle. Costs about 20 of GitHub's 2,000 free Actions
# minutes a month.
#
# Set the repository variable KEEPALIVE_URL to the Space's direct URL, e.g.
#   https://<user>-<space>.hf.space
# (Settings -> Secrets and variables -> Actions -> Variables). With no value
# set, the job does nothing.
name: keep-awake

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Open the app so the host does not idle it
        env:
          URL: ${{ vars.KEEPALIVE_URL }}
        run: |
          if [ -z "$URL" ]; then echo "KEEPALIVE_URL not set; nothing to do"; exit 0; fi
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 90 -L "$URL")
          echo "GET $URL -> HTTP $code"
          # a sleeping Space answers with a wake-up page; any answer at all is enough
          [ "$code" != "000" ]
